name: Deployment Blue-Green

on:
  workflow_dispatch:
    inputs:
      simular_fallo:
        description: 'Simular fallo en ambiente Green'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Generar aplicacion
        run: mvn clean package -DskipTests

      - name: Guardar aplicacion
        uses: actions/upload-artifact@v4
        with:
          name: aplicacion-java
          path: target/*.jar

  acceptance:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar prueba de aceptacion
        run: mvn -Dtest=CompraAcceptanceTest test

  deploy-green:
    name: Deploy Green
    runs-on: ubuntu-latest
    needs: acceptance

    steps:
      - name: Descargar aplicacion
        uses: actions/download-artifact@v4
        with:
          name: aplicacion-java
          path: aplicacion

      - name: Desplegar version Green
        run: |
          mkdir -p deployment/green
          cp aplicacion/*.jar deployment/green/
          echo "Version GREEN desplegada en ambiente de pruebas"
          echo "BLUE permanece como version estable"
          ls -la deployment/green

      - name: Guardar ambiente Green
        uses: actions/upload-artifact@v4
        with:
          name: ambiente-green
          path: deployment/green/


  validar-green:
    name: Validar Green
    runs-on: ubuntu-latest
    needs: deploy-green

    outputs:
      estado: ${{ steps.validacion.outputs.estado }}

    steps:
      - name: Descargar ambiente Green
        uses: actions/download-artifact@v4
        with:
          name: ambiente-green
          path: deployment/green

      - name: Validar despliegue
        id: validacion
        run: |
          if [ "${{ inputs.simular_fallo }}" = "true" ]; then
            echo "Se detecto un problema en GREEN"
            echo "estado=fallo" >> "$GITHUB_OUTPUT"
          else
            echo "GREEN funciona correctamente"
            echo "estado=ok" >> "$GITHUB_OUTPUT"
          fi


  activar-green:
    name: Activar Green
    runs-on: ubuntu-latest
    needs: validar-green
    if: needs.validar-green.outputs.estado == 'ok'

    steps:
      - name: Cambiar ambiente activo
        run: |
          echo "GREEN" > ambiente-activo.txt
          echo "Version GREEN activada correctamente"
          echo "Ambiente activo:"
          cat ambiente-activo.txt


  rollback:
    name: Rollback a Blue
    runs-on: ubuntu-latest
    needs: validar-green
    if: needs.validar-green.outputs.estado == 'fallo'

    steps:
      - name: Restaurar version Blue
        run: |
          echo "BLUE" > ambiente-activo.txt
          echo "Fallo detectado en GREEN"
          echo "Rollback ejecutado correctamente"
          echo "Se mantiene BLUE como version estable"
          echo "Ambiente activo:"
          cat ambiente-activo.txt